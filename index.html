<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Creating a Stacked Card Layout</title>
</head>
<body>
    <div class="parent">
        <div class="box box1">
        <h2>Card One</h2>
        <p>This is first card with a light coral background.</p>
    </div>
    <div class="box box2">
        <h2>Card Two</h2>
        <p>This is second card with a light blue background.</p>
    </div>
    <div class="box box3">
        <h2>Card Three</h2>
        <p>This is third card with a light green background.</p>
    </div>
    </div>
</body>
</html>
